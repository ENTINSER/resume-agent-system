[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-agent-system"
version = "0.3.0"
description = "4智能体协作代码生成平台"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Agent Platform Team"},
]
keywords = ["agent", "llm", "code-generation", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langgraph>=0.2.0,<0.3.0",
    "langchain>=0.2.0,<0.3.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "fakeredis>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.30.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "sentence-transformers>=2.2.0",
    "qdrant-client>=1.6.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "fakeredis>=2.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "fakeredis>=2.0.0",
]

[project.scripts]
agent-platform = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src" = ["config.yaml"]
