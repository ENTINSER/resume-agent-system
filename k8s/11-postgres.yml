apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "agent"
            - name: POSTGRES_PASSWORD
              value: "agent123"
            - name: POSTGRES_DB
              value: "agent_platform"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agent-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
